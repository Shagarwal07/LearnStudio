<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin: Database Manager – LearnHub</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
  <link href="css/style.css" rel="stylesheet"/>
  <style>
    .sql-editor { font-family: monospace; background: #1e293b; color: #38bdf8; border: none; border-radius: 8px; padding: 1rem; width: 100%; height: 120px; }
    .db-table-wrap { max-height: 500px; overflow: auto; border-radius: 8px; border: 1px solid #e2e8f0; }
    .table-list-item { cursor: pointer; transition: background 0.2s; }
    .table-list-item:hover { background: #f1f5f9; }
  </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark sticky-top">
  <div class="container">
    <a class="navbar-brand fw-bold fs-4" href="index.html">Learn<span>Hub</span></a>
    <div class="ms-auto"><a href="dashboard.html" class="btn btn-outline-light btn-sm">Dashboard</a></div>
  </div>
</nav>

<div class="page-header">
  <div class="container">
    <h1 class="fw-bold mb-2">Database <span>Manager</span></h1>
    <p class="text-secondary mb-0">Direct SQL access and table management.</p>
  </div>
</div>

<div class="container py-5">
  <div class="row g-4">
    <!-- Table List -->
    <div class="col-lg-3">
      <div class="bg-white rounded-3 p-4 shadow-sm h-100">
        <h6 class="fw-bold mb-3"><i class="bi bi-table me-2"></i>Tables</h6>
        <div id="tableList" class="list-group list-group-flush small"></div>
      </div>
    </div>

    <!-- Query Editor -->
    <div class="col-lg-9">
      <div class="bg-white rounded-3 p-4 shadow-sm mb-4">
        <h6 class="fw-bold mb-3"><i class="bi bi-terminal me-2"></i>Run SQL Query</h6>
        <textarea class="sql-editor mb-3" id="sqlInput" placeholder="SELECT * FROM users LIMIT 10;"></textarea>
        <div class="d-flex justify-content-between">
          <button class="btn btn-dark fw-semibold" onclick="executeSql()" id="runBtn">Execute Query</button>
          <div id="queryTime" class="small text-muted pt-2"></div>
        </div>
      </div>

      <!-- Results Area -->
      <div id="resultArea" class="bg-white rounded-3 p-4 shadow-sm d-none">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h6 class="fw-bold mb-0">Results</h6>
          <span class="badge bg-primary" id="rowCount">0 rows</span>
        </div>
        <div class="db-table-wrap">
          <table class="table table-sm table-hover small mb-0" id="resultTable">
            <thead class="table-light sticky-top"></thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
      <div id="sqlError" class="alert alert-danger d-none mt-3"></div>
    </div>
  </div>
</div>

<script src="js/api.js"></script>
<script>
  requireAuth();

  async function loadTables() {
    try {
      const res = await fetch(`${API}/admin/tables`, { headers: authHeaders() });
      const tables = await res.json();
      const list = document.getElementById('tableList');
      list.innerHTML = tables.map(t => `
        <div class="table-list-item p-2 rounded d-flex justify-content-between" onclick="quickSelect('${t.name}')">
          <span>${t.name}</span>
          <span class="text-muted">${t.rowCount}</span>
        </div>`).join('');
    } catch (e) { console.error("Table load failed", e); }
  }

  function quickSelect(table) {
    document.getElementById('sqlInput').value = `SELECT * FROM \`${table}\` LIMIT 50;`;
    executeSql();
  }

  async function executeSql() {
    const sql = document.getElementById('sqlInput').value.trim();
    if (!sql) return;

    const btn = document.getElementById('runBtn');
    const errorEl = document.getElementById('sqlError');
    const resultArea = document.getElementById('resultArea');
    const table = document.getElementById('resultTable');
    
    btn.disabled = true;
    errorEl.classList.add('d-none');

    try {
      const res = await fetch(`${API}/admin/sql`, {
        method: 'POST',
        headers: authHeaders(),
        body: JSON.stringify({ sql })
      });
      const data = await res.json();

      if (!data.success) {
        errorEl.textContent = data.error;
        errorEl.classList.remove('d-none');
        resultArea.classList.add('d-none');
      } else {
        resultArea.classList.remove('d-none');
        document.getElementById('queryTime').textContent = `Executed in ${data.executionMs}ms`;
        
        if (data.type === 'SELECT') {
          document.getElementById('rowCount').textContent = `${data.rowCount} rows`;
          // Render Columns
          table.querySelector('thead').innerHTML = `<tr>${data.columns.map(c => `<th>${c}</th>`).join('')}</tr>`;
          // Render Rows
          table.querySelector('tbody').innerHTML = data.rows.map(row => 
            `<tr>${row.map(cell => `<td>${cell === null ? '<em class="text-muted">NULL</em>' : cell}</td>`).join('')}</tr>`
          ).join('');
        } else {
          document.getElementById('rowCount').textContent = `${data.affectedRows} affected`;
          table.querySelector('thead').innerHTML = '<tr><th>Status</th></tr>';
          table.querySelector('tbody').innerHTML = `<tr><td class="text-success">${data.message}</td></tr>`;
          loadTables(); // Refresh table counts
        }
      }
    } catch (e) {
      errorEl.textContent = "Request failed. Ensure Spring Boot is running and you have ADMIN rights.";
      errorEl.classList.remove('d-none');
    } finally {
      btn.disabled = false;
    }
  }

  loadTables();
</script>
</body>
</html>
