<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Instructor Dashboard – LearnHub</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
  <link href="css/style.css" rel="stylesheet"/>
  <style>
    .upload-area {
      border: 2px dashed #dee2e6;
      border-radius: 12px;
      padding: 40px;
      text-align: center;
      background: #f8fafc;
      transition: all 0.3s ease;
      cursor: pointer;
    }
    .upload-area:hover {
      border-color: #4f46e5;
      background: #f1f5f9;
    }
  </style>
</head>
<body>

<!-- Sidebar -->
<aside class="sidebar" id="sidebar">
  <div class="brand">Learn<span>Hub</span></div>
  <nav class="nav flex-column">
    <a href="teacher-dashboard.html" class="nav-link active"><i class="bi bi-speedometer2"></i> Dashboard</a>
    <a href="#" class="nav-link"><i class="bi bi-journal-plus"></i> Create Course</a>
    <a href="#" class="nav-link"><i class="bi bi-people-fill"></i> My Students</a>
    <a href="#" class="nav-link"><i class="bi bi-chat-dots-fill"></i> Course Doubts</a>
    <a href="#" class="nav-link"><i class="bi bi-graph-up-arrow"></i> Analytics</a>
    <hr class="border-secondary my-2"/>
    <a href="#" onclick="logout()" class="nav-link text-danger">
      <i class="bi bi-box-arrow-left"></i> Logout
    </a>
  </nav>
</aside>

<div class="main-content">

  <!-- Top Bar -->
  <div class="top-bar">
    <div class="d-flex align-items-center gap-3">
      <button class="btn btn-sm btn-light d-lg-none"
              onclick="document.getElementById('sidebar').classList.toggle('open')">
        <i class="bi bi-list fs-5"></i>
      </button>
      <div>
        <h5 class="mb-0 fw-bold" id="greetMsg">Welcome, Instructor! 🎓</h5>
        <p class="text-muted small mb-0">Ready to share your knowledge today?</p>
      </div>
    </div>
    <div class="d-flex align-items-center gap-2">
      <div id="userAvatar"
           style="width:36px;height:36px;background:#059669;border-radius:50%;
                  display:flex;align-items:center;justify-content:center;
                  color:#fff;font-weight:700">T</div>
      <span class="small fw-semibold d-none d-md-block" id="userNameDisplay">Loading...</span>
    </div>
  </div>

  <!-- Main Container -->
  <div class="container-fluid py-4">
    <div class="row g-4">
      <div class="col-lg-8 mx-auto">
        <div class="bg-white rounded-3 p-4 shadow-sm border">
          <h5 class="fw-bold mb-4"><i class="bi bi-cloud-arrow-up me-2 text-primary"></i>Upload Course Content</h5>
          
          <form id="uploadForm">
            <div class="mb-4">
              <label class="form-label fw-semibold">Select Course</label>
              <select class="form-select" id="courseSelect" required>
                <option value="" selected disabled>Choose the course for this lesson...</option>
                <!-- These would be dynamically loaded from your API -->
                <option value="1">Advanced Java Programming</option>
                <option value="2">Modern Web Development</option>
                <option value="3">Python for Data Science</option>
              </select>
            </div>

            <div class="mb-4">
              <label class="form-label fw-semibold">Lesson Title</label>
              <input type="text" class="form-control" placeholder="e.g., Introduction to Spring Security" required>
            </div>

            <div class="upload-area mb-4" onclick="document.getElementById('fileInput').click()">
              <i class="bi bi-camera-video-fill text-muted mb-3" style="font-size: 2.5rem;"></i>
              <h6 class="fw-bold">Click to upload video or drag and drop</h6>
              <p class="text-muted small mb-0">Supported formats: MP4, MKV (Max 500MB)</p>
              <input type="file" id="fileInput" class="d-none" accept="video/*">
            </div>

            <div class="mb-4">
               <label class="form-label fw-semibold">Additional Resources (Optional)</label>
               <input type="file" class="form-control" multiple>
               <div class="form-text text-muted">Upload PDF notes or code files.</div>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
              <i class="bi bi-upload me-2"></i>Publish to Course
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script>
  requireAuth();
  window.addEventListener('DOMContentLoaded', () => {
    const user = getUser();
    if (user) {
      document.getElementById('userNameDisplay').textContent = user.name;
      document.getElementById('userAvatar').textContent = user.name.charAt(0).toUpperCase();
    }
  });
</script>
</body>
</html>
