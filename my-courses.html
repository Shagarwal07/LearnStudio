<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Courses – LearnHub</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
  <link href="css/style.css" rel="stylesheet"/>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark sticky-top">
  <div class="container">
    <a class="navbar-brand fw-bold fs-4" href="index.html">Learn<span>Hub</span></a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav mx-auto gap-1">
        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="courses.html">Courses</a></li>
        <li class="nav-item"><a class="nav-link" href="#">Instructors</a></li>
        <li class="nav-item"><a class="nav-link" href="#">Pricing</a></li>
      </ul>
      <div class="d-flex gap-2" id="navActions">
        <a href="dashboard.html" class="btn btn-outline-light btn-sm px-3">Dashboard</a>
        <!-- auth btn injected by JS -->
      </div>
    </div>
  </div>
</nav>

<!-- Page Header -->
<div class="page-header">
  <div class="container">
    <h1 class="fw-bold mb-2">My Enrolled <span>Courses</span></h1>
    <p class="text-secondary mb-0">Continue your learning journey where you left off.</p>
  </div>
</div>

<div class="container py-5">
  <div class="row g-4" id="myCoursesGrid">
    <!-- Enrolled courses will be rendered here -->
    <div class="text-center py-5 text-muted col-12">
      <div class="spinner-border spinner-border-sm text-primary me-2"></div>Loading your courses...
    </div>
  </div>
</div>

<!-- Footer -->
<footer class="py-4 mt-4">
  <div class="container text-center small">
    <span class="brand">Learn<span>Hub</span></span>
    <span class="ms-3">© 2026 LearnHub. Made with Love <i class="bi bi-heart-fill text-danger"></i></span>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script>
  requireAuth();

  // Static course data for lookup (should ideally come from a central source or API)
  const COURSES_DATA = [
    { id:1, title:'Full Stack Web Development',      bg:'linear-gradient(135deg,#4f46e5,#7c3aed)', icon:'💻', level:'Beginner',     levelCls:'bg-primary',           rating:'★★★★★', numericRating: 5.0, reviews:'2.4k', lessons:120, hours:48, free:true,  price: 0,    category: 'Web Development' },
    { id:2, title:'Machine Learning A-Z',            bg:'linear-gradient(135deg,#0e7490,#06b6d4)', icon:'🤖', level:'Intermediate', levelCls:'bg-warning text-dark', rating:'★★★★★', numericRating: 5.0, reviews:'1.8k', lessons:95,  hours:36, free:true,  price: 0,    category: 'Data Science' },
    { id:3, title:'UI/UX Design Mastery',            bg:'linear-gradient(135deg,#7c3aed,#db2777)', icon:'🎨', level:'All Levels',   levelCls:'bg-success',           rating:'★★★★☆', numericRating: 4.0, reviews:'1.2k', lessons:80,  hours:28, free:true,  price: 0,    category: 'UI/UX Design' },
    { id:4, title:'AWS Cloud Practitioner',          bg:'linear-gradient(135deg,#d97706,#f59e0b)', icon:'☁️', level:'Advanced',     levelCls:'bg-danger',            rating:'★★★★★', numericRating: 5.0, reviews:'980',  lessons:65,  hours:22, free:true,  price: 0,    category: 'Cloud Computing' },
    { id:5, title:'Flutter Mobile Development',      bg:'linear-gradient(135deg,#16a34a,#4ade80)', icon:'📱', level:'Beginner',     levelCls:'bg-primary',           rating:'★★★★★', numericRating: 5.0, reviews:'760',  lessons:88,  hours:32, free:true,  price: 0,    category: 'Mobile Development' },
    { id:6, title:'Ethical Hacking & Cybersecurity', bg:'linear-gradient(135deg,#dc2626,#f87171)', icon:'🔐', level:'Intermediate', levelCls:'bg-warning text-dark', rating:'★★★★★', numericRating: 4.8, reviews:'1.1k', lessons:72,  hours:30, free:false, price: 1499, category: 'Cybersecurity' },
    { id:7, title:'DevOps with Docker & Kubernetes', bg:'linear-gradient(135deg,#0f172a,#334155)', icon:'🐳', level:'Advanced',     levelCls:'bg-danger',            rating:'★★★★★', numericRating: 4.7, reviews:'890',  lessons:90,  hours:40, free:false, price: 1999, category: 'Cloud Computing' },
    { id:8, title:'Data Analytics with Python',      bg:'linear-gradient(135deg,#0284c7,#38bdf8)', icon:'📊', level:'Beginner',     levelCls:'bg-primary',           rating:'★★★★☆', numericRating: 4.2, reviews:'1.5k', lessons:75,  hours:26, free:false, price: 1299, category: 'Data Science' },
    { id:9, title:'React.js – The Complete Guide',   bg:'linear-gradient(135deg,#9333ea,#c084fc)', icon:'⚛️', level:'Intermediate', levelCls:'bg-warning text-dark', rating:'★★★★★', numericRating: 4.9, reviews:'2.1k', lessons:110, hours:44, free:false, price: 1799, category: 'Web Development' },
  ];

  // ── Render enrolled course cards ────────────────────────────────
  async function renderMyCourses() {
    const grid = document.getElementById('myCoursesGrid');
    grid.innerHTML = `<div class="text-center py-5 text-muted col-12">
                        <div class="spinner-border spinner-border-sm text-primary me-2"></div>Loading your courses...
                      </div>`;

    try {
      const enrollments = await apiMyEnrollments();

      if (!Array.isArray(enrollments) || enrollments.length === 0) {
        grid.innerHTML = `
          <div class="col-12 text-center py-5">
            <div style="font-size:3.5rem">📚</div>
            <h6 class="mt-3 fw-bold">You haven't enrolled in any courses yet!</h6>
            <p class="text-muted small">Browse and enroll in courses to start learning.</p>
            <a href="courses.html" class="btn btn-primary px-4">Browse Courses</a>
          </div>`;
        return;
      }

      const courseCardsHtml = enrollments.map(e => {
        const course = COURSES_DATA.find(c => c.id === e.courseId);
        if (!course) {
          console.warn(`Course with ID ${e.courseId} not found in static data.`);
          return ''; // Skip if course data is missing
        }

        const progress = Math.max(0, Math.min(100, Number(e.progress) || 0));
        const status = getProgressVariant(progress); // Reusing helper from dashboard.html
        const detailUrl = buildCourseDetailUrl(e.courseId);

        return `
        <div class="col-md-6 col-xl-4">
          <div class="card course-card h-100">
            <a href="${detailUrl}" class="text-decoration-none">
              <div class="course-thumb" style="background:${course.bg}">${course.icon}</div>
            </a>
            <div class="card-body d-flex flex-column">
              <span class="badge ${course.levelCls} badge-level mb-2 align-self-start">${course.level}</span>
              <h6 class="fw-bold mb-1">${course.title}</h6>
              <div class="rating-stars mb-1">${course.rating} <span class="text-muted small">(${course.reviews})</span></div>
              <div class="course-meta d-flex gap-3 mb-3">
                <span><i class="bi bi-play-circle"></i> ${course.lessons} lessons</span>
                <span><i class="bi bi-clock"></i> ${course.hours}h</span>
              </div>
              <div class="mt-auto">
                <div class="d-flex justify-content-between small mb-1">
                  <span class="text-muted">${e.completedLessons}/${e.totalLessons} lessons completed</span>
                  <span class="fw-semibold">${progress}%</span>
                </div>
                <div class="progress" style="height:8px">
                  <div class="progress-bar ${status.bar}" role="progressbar" style="width:${progress}%"
                       aria-valuenow="${progress}" aria-valuemin="0" aria-valuemax="100"></div>
                </div>
              </div>
              <div class="d-grid mt-3">
                <a href="${detailUrl}" class="btn btn-sm btn-success fw-semibold">Continue Learning</a>
              </div>
            </div>
          </div>
        </div>`;
      }).join('');

      grid.innerHTML = courseCardsHtml;

    } catch (err) {
      grid.innerHTML = `
        <div class="col-12 alert alert-warning">
          <i class="bi bi-exclamation-triangle me-2"></i>
          Could not load your courses. Make sure Spring Boot is running on
          <strong>http://localhost:8080</strong>
          <br><small class="text-muted">${err.message}</small>
        </div>`;
      console.error('My Courses error:', err);
    }
  }

  // Helper function for progress bar variant (copied from dashboard.html)
  function getProgressVariant(progress) {
    if (progress >= 100) return { badge:'bg-success', bar:'bg-success', label:'Completed' };
    if (progress > 0) return { badge:'bg-warning text-dark', bar:'bg-warning', label:'In Progress' };
    return { badge:'bg-secondary', bar:'bg-secondary', label:'Not Started' };
  }

  // ── Init ───────────────────────────────────────────────
  if (getToken()) {
    document.getElementById('navActions').insertAdjacentHTML('beforeend',
      '<button onclick="logout()" class="btn btn-danger btn-sm px-3"><i class="bi bi-box-arrow-right me-1"></i>Logout</button>');
  } else {
    document.getElementById('navActions').insertAdjacentHTML('beforeend',
      '<a href="login.html" class="btn btn-primary btn-sm px-3">Login</a>');
  }

  renderMyCourses();
</script>
</body>
</html>
