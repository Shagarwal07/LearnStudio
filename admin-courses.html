<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin: Course Management – LearnStudio</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
  <link href="css/style.css" rel="stylesheet"/>
  <style>
    .admin-table-container {
      max-height: calc(100vh - 200px); /* Adjust as needed */
      overflow-y: auto;
    }
    .admin-table th, .admin-table td {
      vertical-align: middle;
    }
    .admin-table .course-thumb-sm {
      width: 40px; height: 40px; border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.2rem; color: #fff;
      flex-shrink: 0;
    }
  </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark sticky-top">
  <div class="container">
    <a class="navbar-brand fw-bold fs-4" href="index.html">Learn<span>Studio</span></a>
    <div class="d-flex gap-2 ms-auto" id="navActions">
      <a href="dashboard.html" class="btn btn-outline-light btn-sm">Dashboard</a>
      <!-- Login btn injected by JS only when not logged in -->
    </div>
  </div>
</nav>

<!-- Page Header -->
<div class="page-header">
  <div class="container">
    <h1 class="fw-bold mb-2">Admin: <span>Course Management</span></h1>
    <p class="text-secondary mb-0">Manage all courses in the LearnStudio platform.</p>
  </div>
</div>

<div class="container py-5">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h5 class="fw-bold mb-0">All Courses</h5>
    <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#courseModal" onclick="openCourseModal()">
      <i class="bi bi-plus-circle me-1"></i> Add New Course
    </button>
  </div>

  <div class="bg-white rounded-3 p-3 shadow-sm admin-table-container">
    <table class="table table-hover admin-table mb-0">
      <thead>
        <tr>
          <th>ID</th>
          <th>Title</th>
          <th>Level</th>
          <th>Price</th>
          <th>Lessons</th>
          <th>Hours</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="courseTableBody">
        <tr><td colspan="7" class="text-center text-muted py-4">
          <div class="spinner-border spinner-border-sm text-primary me-2"></div>Loading courses...
        </td></tr>
      </tbody>
    </table>
  </div>
</div>

<!-- Course Edit/Add Modal -->
<div class="modal fade" id="courseModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content rounded-4 border-0 shadow-lg">
      <div class="modal-header border-0 pb-0">
        <h5 class="modal-title fw-bold" id="courseModalTitle">Add New Course</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="courseForm">
          <input type="hidden" id="courseId"/>
          <div class="mb-3">
            <label for="courseTitle" class="form-label small fw-semibold">Course Title</label>
            <input type="text" class="form-control" id="courseTitle" required/>
          </div>
          <div class="mb-3">
            <label for="courseDescription" class="form-label small fw-semibold">Description</label>
            <textarea class="form-control" id="courseDescription" rows="3"></textarea>
          </div>
          <div class="row g-3 mb-3">
            <div class="col-md-6">
              <label for="courseLevel" class="form-label small fw-semibold">Level</label>
              <select class="form-select" id="courseLevel">
                <option value="Beginner">Beginner</option>
                <option value="Intermediate">Intermediate</option>
                <option value="Advanced">Advanced</option>
                <option value="All Levels">All Levels</option>
              </select>
            </div>
            <div class="col-md-6">
              <label for="coursePrice" class="form-label small fw-semibold">Price (₹)</label>
              <input type="number" class="form-control" id="coursePrice" min="0" value="0" required/>
            </div>
          </div>
          <div class="row g-3 mb-3">
            <div class="col-md-6">
              <label for="courseLessons" class="form-label small fw-semibold">Total Lessons</label>
              <input type="number" class="form-control" id="courseLessons" min="0" value="0" required/>
            </div>
            <div class="col-md-6">
              <label for="courseHours" class="form-label small fw-semibold">Total Hours</label>
              <input type="number" class="form-control" id="courseHours" min="0" value="0" required/>
            </div>
          </div>
          <div class="mb-3">
            <label for="coursePreviewVideoUrl" class="form-label small fw-semibold">Preview Video URL</label>
            <input type="url" class="form-control" id="coursePreviewVideoUrl" placeholder="e.g., https://www.youtube.com/watch?v=..." />
          </div>
          <div class="d-grid mt-4">
            <button type="submit" class="btn btn-primary fw-semibold" id="saveCourseBtn">Save Course</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<!-- Footer -->
<footer class="py-4 mt-4">
  <div class="container text-center small">
    <span class="brand">Learn<span>Studio</span></span>
    <span class="ms-3">© 2026 LearnStudio. Made with Love <i class="bi bi-heart-fill text-danger"></i></span>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script>
  requireAuth(); // Ensure user is logged in

  const courseModal = new bootstrap.Modal(document.getElementById('courseModal'));
  const courseForm = document.getElementById('courseForm');
  const courseModalTitle = document.getElementById('courseModalTitle');
  const saveCourseBtn = document.getElementById('saveCourseBtn');

  const THUMB_META = [
    { bg: 'linear-gradient(135deg,#4f46e5,#7c3aed)', icon: '💻' },
    { bg: 'linear-gradient(135deg,#0e7490,#06b6d4)', icon: '🤖' },
    { bg: 'linear-gradient(135deg,#7c3aed,#db2777)', icon: '🎨' },
    { bg: 'linear-gradient(135deg,#d97706,#f59e0b)', icon: '☁️' },
    { bg: 'linear-gradient(135deg,#16a34a,#4ade80)', icon: '📱' }
  ];

  async function loadCourses() {
    const tableBody = document.getElementById('courseTableBody');
    tableBody.innerHTML = `<tr><td colspan="7" class="text-center text-muted py-4">
      <div class="spinner-border spinner-border-sm text-primary me-2"></div>Loading courses...
    </td></tr>`;
    try {
      const courses = await apiGetCourses();
      if (courses.length === 0) {
        tableBody.innerHTML = `<tr><td colspan="7" class="text-center text-muted py-4">No courses found.</td></tr>`;
        return;
      }

      tableBody.innerHTML = courses.map((c, i) => {
        const meta = THUMB_META[i % THUMB_META.length];
        return `
          <tr>
            <td>${c.id}</td>
            <td>
              <div class="d-flex align-items-center gap-2">
                <div class="course-thumb-sm" style="background:${meta.bg}">${meta.icon}</div>
                <span class="fw-semibold">${c.title}</span>
              </div>
            </td>
            <td>${c.level || 'N/A'}</td>
            <td>${c.price === 0 ? 'Free' : `₹${c.price.toLocaleString('en-IN')}`}</td>
            <td>${c.lessons || 0}</td>
            <td>${c.hours || 0}h</td>
            <td>
              <button class="btn btn-sm btn-outline-primary me-2" onclick="editCourse(${c.id})">
                <i class="bi bi-pencil"></i> Edit
              </button>
              <button class="btn btn-sm btn-outline-danger" onclick="deleteCourse(${c.id}, '${c.title}')">
                <i class="bi bi-trash"></i> Delete
              </button>
            </td>
          </tr>
        `;
      }).join('');
    } catch (error) {
      tableBody.innerHTML = `<tr><td colspan="7" class="text-center text-danger py-4">Error loading courses: ${error.message}</td></tr>`;
      console.error('Error loading courses:', error);
    }
  }

  function openCourseModal(course = {}) {
    courseForm.reset();
    document.getElementById('courseId').value = course.id || '';
    document.getElementById('courseTitle').value = course.title || '';
    document.getElementById('courseDescription').value = course.description || '';
    document.getElementById('courseLevel').value = course.level || 'Beginner';
    document.getElementById('coursePrice').value = course.price !== undefined ? course.price : 0;
    document.getElementById('courseLessons').value = course.lessons !== undefined ? course.lessons : 0;
    document.getElementById('courseHours').value = course.hours !== undefined ? course.hours : 0;
    document.getElementById('coursePreviewVideoUrl').value = course.previewVideoUrl || '';

    courseModalTitle.textContent = course.id ? 'Edit Course' : 'Add New Course';
    saveCourseBtn.textContent = course.id ? 'Save Changes' : 'Add Course';
    courseModal.show();
  }

  async function editCourse(id) {
    try {
      const course = await apiGetCourse(id);
      openCourseModal(course);
    } catch (error) {
      alert('Error fetching course details: ' + error.message);
      console.error('Error fetching course for edit:', error);
    }
  }

  courseForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    saveCourseBtn.disabled = true;
    saveCourseBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Saving...';

    const courseId = document.getElementById('courseId').value;
    const courseData = {
      title: document.getElementById('courseTitle').value,
      description: document.getElementById('courseDescription').value,
      level: document.getElementById('courseLevel').value,
      price: parseFloat(document.getElementById('coursePrice').value),
      lessons: parseInt(document.getElementById('courseLessons').value),
      hours: parseInt(document.getElementById('courseHours').value),
      previewVideoUrl: document.getElementById('coursePreviewVideoUrl').value || null
    };

    try {
      if (courseId) {
        await apiUpdateCourse(courseId, courseData);
        alert('Course updated successfully!');
      } else {
        await apiCreateCourse(courseData); // Assuming a create API exists
        alert('Course added successfully!');
      }
      courseModal.hide();
      loadCourses(); // Refresh the list
    } catch (error) {
      alert('Error saving course: ' + error.message);
      console.error('Error saving course:', error);
    } finally {
      saveCourseBtn.disabled = false;
      saveCourseBtn.textContent = courseId ? 'Save Changes' : 'Add Course';
    }
  });

  async function deleteCourse(id, title) {
    if (!confirm(`Are you sure you want to delete the course "${title}" (ID: ${id})? This action cannot be undone.`)) {
      return;
    }
    try {
      await apiDeleteCourse(id);
      alert('Course deleted successfully!');
      loadCourses(); // Refresh the list
    } catch (error) {
      alert('Error deleting course: ' + error.message);
      console.error('Error deleting course:', error);
    }
  }

  // Initial load
  loadCourses();
</script>
</body>
</html>
