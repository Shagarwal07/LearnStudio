<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login – LearnHub</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
  <link href="css/style.css" rel="stylesheet"/>
  <!-- Google Identity Services -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    .auth-wrapper { background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 60%, #0e7490 100%); }
    .auth-card { max-width: 480px; }
    .auth-divider { display: flex; align-items: center; gap: .75rem; color: #94a3b8; font-size: .82rem; margin: 1.1rem 0; }
    .auth-divider::before, .auth-divider::after { content: ''; flex: 1; height: 1px; background: #e2e8f0; }
    .google-btn {
      width: 100%; padding: .65rem 1rem;
      border: 1.5px solid #e2e8f0; border-radius: 10px;
      background: #fff; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: .6rem;
      font-size: .9rem; font-weight: 500; color: #1e293b;
      transition: box-shadow .2s, border-color .2s;
    }
    .google-btn:hover { box-shadow: 0 2px 12px rgba(0,0,0,.1); border-color: #cbd5e1; }
    .google-btn img { width: 20px; height: 20px; }
    .nav-pills .nav-link { border-radius: 8px; font-size: .9rem; }
    .nav-pills .nav-link.active { background: var(--primary, #4f46e5); }
    .form-control, .form-select { border-radius: 8px; font-size: .9rem; }
    .input-group-text { background: #f8fafc; border-right: none; }
    .input-group .form-control { border-left: none; }
    .input-group .form-control:focus { border-color: #dee2e6; box-shadow: none; }
    .input-group:focus-within { box-shadow: 0 0 0 .2rem rgba(79,70,229,.2); border-radius: 8px; }
    .input-group:focus-within .input-group-text,
    .input-group:focus-within .form-control,
    .input-group:focus-within .btn-outline-secondary { border-color: #4f46e5; }
    .btn-submit { background: #4f46e5; border: none; border-radius: 8px; padding: .7rem; font-weight: 600; }
    .btn-submit:hover { background: #3730a3; }
    .role-card { border: 2px solid #e2e8f0; border-radius: 12px; padding: 1.2rem; cursor: pointer; transition: all .2s; text-align:center; }
    .role-card:hover { border-color: #4f46e5; background: #f5f3ff; }
    .role-card.selected { border-color: #4f46e5; background: #f5f3ff; }
    .role-card .role-icon { font-size: 2rem; margin-bottom: .4rem; }
  </style>
</head>
<body>
<div class="auth-wrapper">
  <div class="auth-card mx-auto px-3 py-5">

    <!-- Logo -->
    <div class="text-center mb-4">
      <a href="index.html" class="text-decoration-none">
        <div class="logo">Learn<span>Hub</span></div>
      </a>
      <p class="text-muted small mt-1">Your gateway to world-class learning</p>
    </div>

    <!-- Card -->
    <div class="bg-white rounded-4 p-4 shadow-lg">

      <!-- Tabs -->
      <ul class="nav nav-pills nav-fill mb-4 bg-light rounded-3 p-1" id="authTab">
        <li class="nav-item">
          <button class="nav-link active" data-bs-toggle="pill" data-bs-target="#loginPane">Sign In</button>
        </li>
        <li class="nav-item">
          <button class="nav-link" data-bs-toggle="pill" data-bs-target="#registerPane">Register</button>
        </li>
      </ul>

      <!-- Error alert -->
      <div id="authError" class="alert alert-danger alert-inline d-none"></div>

      <div class="tab-content">

        <!-- ── Login ── -->
        <div class="tab-pane fade show active" id="loginPane">

          <!-- Google Sign-In (login only — must be registered) -->
          <button class="google-btn mb-1" id="googleSignInBtn" onclick="triggerGoogleLogin()">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google"/>
            Continue with Google
          </button>

          <div class="auth-divider">or sign in with email</div>

          <form id="loginForm" novalidate>
            <div class="mb-3">
              <label class="form-label small fw-semibold">Email Address</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-envelope text-muted"></i></span>
                <input type="email" class="form-control" id="loginEmail" placeholder="you@example.com" required/>
              </div>
            </div>
            <div class="mb-3">
              <div class="d-flex justify-content-between align-items-center mb-1">
                <label class="form-label small fw-semibold mb-0">Password</label>
                <a href="#" class="small text-primary text-decoration-none">Forgot password?</a>
              </div>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-lock text-muted"></i></span>
                <input type="password" class="form-control" id="loginPass" placeholder="••••••••" required/>
                <button class="btn btn-outline-secondary" type="button" onclick="togglePass('loginPass',this)">
                  <i class="bi bi-eye"></i>
                </button>
              </div>
            </div>
            <div class="form-check mb-3">
              <input class="form-check-input" type="checkbox" id="remember"/>
              <label class="form-check-label small" for="remember">Remember me for 30 days</label>
            </div>
            <button type="submit" class="btn btn-submit btn-primary w-100 text-white" id="loginBtn">
              Sign In
            </button>
          </form>

          <div class="text-center mt-3">
            <a href="admin.html" class="small text-muted text-decoration-none">
              <i class="bi bi-shield-lock me-1"></i>Admin Panel
            </a>
          </div>
        </div>

        <!-- ── Register ── -->
        <div class="tab-pane fade" id="registerPane">

          <!-- Google Sign-Up (shows role picker first) -->
          <button class="google-btn mb-1" onclick="openRolePicker()">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google"/>
            Sign up with Google
          </button>

          <div class="auth-divider">or register with email</div>

          <form id="registerForm" novalidate>
            <div class="row g-2 mb-3">
              <div class="col-6">
                <label class="form-label small fw-semibold">First Name</label>
                <input type="text" class="form-control" id="regFirst" placeholder="Rahul" required/>
              </div>
              <div class="col-6">
                <label class="form-label small fw-semibold">Last Name</label>
                <input type="text" class="form-control" id="regLast" placeholder="Sharma" required/>
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label small fw-semibold">Email Address</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-envelope text-muted"></i></span>
                <input type="email" class="form-control" id="regEmail" placeholder="you@example.com" required/>
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label small fw-semibold">Password</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-lock text-muted"></i></span>
                <input type="password" class="form-control" id="regPass" placeholder="Min. 8 characters" required/>
                <button class="btn btn-outline-secondary" type="button" onclick="togglePass('regPass',this)">
                  <i class="bi bi-eye"></i>
                </button>
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label small fw-semibold">I want to</label>
              <select class="form-select" id="regRole">
                <option value="STUDENT">📚 Learn new skills</option>
                <option value="INSTRUCTOR">🎓 Teach & earn</option>
              </select>
            </div>
            <div class="form-check mb-3">
              <input class="form-check-input" type="checkbox" id="agreeTerms" required/>
              <label class="form-check-label small" for="agreeTerms">
                I agree to the <a href="#" class="text-primary">Terms</a> &
                <a href="#" class="text-primary">Privacy Policy</a>
              </label>
            </div>
            <button type="submit" class="btn btn-submit btn-primary w-100 text-white" id="registerBtn">
              Create Free Account
            </button>
          </form>
        </div>
      </div>
    </div>

    <div class="text-center mt-3">
      <a href="index.html" class="small text-secondary text-decoration-none">
        <i class="bi bi-arrow-left me-1"></i>Back to Home
      </a>
    </div>
  </div>
</div>

<!-- Role Picker Modal (Google Sign-Up) -->
<div class="modal fade" id="roleModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered" style="max-width:420px">
    <div class="modal-content rounded-4 border-0 shadow-lg p-2">
      <div class="modal-header border-0 pb-0">
        <h6 class="modal-title fw-bold">Choose your role</h6>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <p class="text-muted small mb-3">How do you want to use LearnHub?</p>
        <div class="row g-3">
          <div class="col-6">
            <div class="role-card" id="roleStudent" onclick="selectRole('STUDENT')">
              <div class="role-icon">📚</div>
              <div class="fw-semibold small">Learn new skills</div>
              <div class="text-muted" style="font-size:.78rem">Student</div>
            </div>
          </div>
          <div class="col-6">
            <div class="role-card" id="roleInstructor" onclick="selectRole('INSTRUCTOR')">
              <div class="role-icon">🎓</div>
              <div class="fw-semibold small">Teach &amp; earn</div>
              <div class="text-muted" style="font-size:.78rem">Instructor</div>
            </div>
          </div>
        </div>
      </div>
      <div class="modal-footer border-0 pt-0">
        <button class="btn btn-primary w-100 fw-semibold" id="continueGoogleBtn"
                onclick="triggerGoogleRegister()" disabled>
          <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg"
               style="width:18px;margin-right:8px"/>Continue with Google
        </button>
      </div>
    </div>
  </div>
</div>

<!-- Hidden Google One Tap div -->
<div id="g_id_onload"
     data-client_id="181483437903-hc2oi74307lk305r5ejj1gohcdm1v52b.apps.googleusercontent.com"
     data-callback="handleGoogleCredential"
     data-auto_prompt="false">
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script>
  // Redirect if already logged in
  if (getToken()) window.location.href = 'dashboard.html';

  function showError(msg) {
    const el = document.getElementById('authError');
    el.textContent = msg;
    el.classList.remove('d-none');
    setTimeout(() => el.classList.add('d-none'), 4000);
  }

  function togglePass(id, btn) {
    const input = document.getElementById(id);
    const isPass = input.type === 'password';
    input.type = isPass ? 'text' : 'password';
    btn.innerHTML = `<i class="bi bi-eye${isPass ? '-slash' : ''}"></i>`;
  }

  function setLoading(btn, loading, defaultText) {
    btn.disabled = loading;
    btn.innerHTML = loading
      ? '<span class="spinner-border spinner-border-sm me-2"></span>Please wait...'
      : defaultText;
  }

  // ── Email Login ──────────────────────────────────────
  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn   = document.getElementById('loginBtn');
    const email = document.getElementById('loginEmail').value.trim();
    const pass  = document.getElementById('loginPass').value;
    setLoading(btn, true, 'Sign In');
    try {
      const res = await apiLogin(email, pass);
      window.location.href = res.role === 'INSTRUCTOR' ? 'teacher-dashboard.html' : 'dashboard.html';
    } catch (err) {
      showError(err.message);
      setLoading(btn, false, 'Sign In');
    }
  });

  // ── Email Register ───────────────────────────────────
  document.getElementById('registerForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    if (!document.getElementById('agreeTerms').checked) {
      showError('Please agree to the Terms & Privacy Policy.');
      return;
    }
    const btn  = document.getElementById('registerBtn');
    const name = document.getElementById('regFirst').value.trim() + ' ' + document.getElementById('regLast').value.trim();
    const email = document.getElementById('regEmail').value.trim();
    const pass  = document.getElementById('regPass').value;
    const role  = document.getElementById('regRole').value;
    setLoading(btn, true, 'Create Free Account');
    try {
      const res = await apiRegister(name, email, pass, role);
      window.location.href = res.role === 'INSTRUCTOR' ? 'teacher-dashboard.html' : 'dashboard.html';
    } catch (err) {
      showError(err.message);
      setLoading(btn, false, 'Create Free Account');
    }
  });

  // ── Google: Login (must already be registered) ────────
  function triggerGoogleLogin() {
    if (typeof google === 'undefined') { showError('Google Sign-In unavailable.'); return; }
    google.accounts.id.initialize({
      client_id: '181483437903-hc2oi74307lk305r5ejj1gohcdm1v52b.apps.googleusercontent.com',
      callback: handleGoogleLogin
    });
    google.accounts.id.prompt(n => {
      if (n.isNotDisplayed() || n.isSkippedMoment())
        google.accounts.id.renderButton(document.getElementById('googleSignInBtn'),
          { theme: 'outline', size: 'large', width: 400 });
    });
  }

  async function handleGoogleLogin(response) {
    try {
      const res = await apiGoogleLogin(response.credential);
      window.location.href = res.role === 'INSTRUCTOR' ? 'teacher-dashboard.html' : 'dashboard.html';
    } catch (err) {
      showError(err.message);
    }
  }

  // ── Google: Register (role picker first) ─────────────
  let selectedRole = null, pendingCredential = null;
  const roleModal = new bootstrap.Modal(document.getElementById('roleModal'));

  function openRolePicker() {
    selectedRole = null;
    pendingCredential = null;
    document.getElementById('roleStudent').classList.remove('selected');
    document.getElementById('roleInstructor').classList.remove('selected');
    document.getElementById('continueGoogleBtn').disabled = true;
    roleModal.show();
  }

  function selectRole(role) {
    selectedRole = role;
    document.getElementById('roleStudent').classList.toggle('selected', role === 'STUDENT');
    document.getElementById('roleInstructor').classList.toggle('selected', role === 'INSTRUCTOR');
    document.getElementById('continueGoogleBtn').disabled = false;
  }

  function triggerGoogleRegister() {
    if (!selectedRole) return;
    if (typeof google === 'undefined') { showError('Google Sign-In unavailable.'); return; }
    roleModal.hide();
    google.accounts.id.initialize({
      client_id: '181483437903-hc2oi74307lk305r5ejj1gohcdm1v52b.apps.googleusercontent.com',
      callback: handleGoogleRegister
    });
    google.accounts.id.prompt(n => {
      if (n.isNotDisplayed() || n.isSkippedMoment()) {
        // One Tap blocked — use popup flow
        google.accounts.oauth2.initTokenClient({
          client_id: '181483437903-hc2oi74307lk305r5ejj1gohcdm1v52b.apps.googleusercontent.com',
          scope: 'email profile',
          callback: () => {}
        });
        showError('Please allow popups and try again, or use email registration.');
      }
    });
  }

  async function handleGoogleRegister(response) {
    try {
      const res = await apiGoogleRegister(response.credential, selectedRole);
      window.location.href = res.role === 'INSTRUCTOR' ? 'teacher-dashboard.html' : 'dashboard.html';
    } catch (err) {
      showError(err.message);
    }
  }
</script>
</body>
</html>
