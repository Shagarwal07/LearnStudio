# ── Server ──────────────────────────────────────
server.port=8080

# ── MySQL Database ───────────────────────────────

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/yourdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:yourpassword}
# spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/lms_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
# spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
# spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:P@ssword2073}
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ──────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ── JWT ──────────────────────────────────────────
jwt.secret=${JWT_SECRET:learnhub2025SecretKeyForJWTTokenGenerationMustBe256BitsLong!}
jwt.expiration=86400000

# ── Google OAuth ─────────────────────────────────
google.client.id=${GOOGLE_CLIENT_ID:YOUR_GOOGLE_CLIENT_ID_HERE}

# ── Gemini AI ────────────────────────────────────
gemini.api.key=${GEMINI_API_KEY:YOUR_GEMINI_API_KEY_HERE}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent

# ── CORS ─────────────────────────────────────────
frontend.url=https://learnstudio.netlify.app/
